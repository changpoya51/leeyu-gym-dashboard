function dateRange(start,end){let a=[];for(let d=start;d<=end;d=addDays(d,1)){a.push(d);if(a.length>35)break}return a}
function deptInsight(dept){if(dept==='sales'){const a=stat('sales','bookings'),b=stat('sales','showups'),c=stat('sales','closes'),r=rate(c,b),src=sourceNames.map(k=>stat('sales',k)),all=src.some(isNum)?src.reduce((n,v)=>n+(v||0),0):null;return `${explainRate('預約 → 到訪',rate(b,a))}${explainRate('到訪 → 成交',r)}${explainRate('來源歸因合計',all,'number')}${infoNotice('不同日期可能發生預約、到訪與成交，單週比例不能直接解讀為同一批客戶轉換率。')}`}
 if(dept==='pt')return `${explainRate('新會員接觸率',rate(stat('pt','contacts'),stat('pt','newMembers')))}${explainRate('PT 體驗成交率',rate(stat('pt','ptCloses'),stat('pt','trials')))}${explainRate('未消化課程快照',stat('pt','backlog'),'number')}${infoNotice('未執行課程、教練可服務容量採用本期最後一個有效數值，不加總每日快照。')}`;
 if(dept==='marketing'){let spend=stat('marketing','spend'),lead=stat('marketing','qualifiedLeads'),hasUnfilledSpend=inPeriod('marketing',selectedWeek()).some(r=>isNum(r.data.reach)&&r.data.reach>0&&!isNum(r.data.spend)),cpl=hasUnfilledSpend?null:rate(spend,lead);return `${explainRate('平均觀看秒數',stat('marketing','watchSeconds'),'average')}${explainRate('3 秒留存率',stat('marketing','retention'))}${explainRate('CPL（僅有填報花費時）',cpl,'money')}${infoNotice('3秒留存率和 CTR 只平均有值且在 0～100% 範圍內的日期；花費未填不等於免費投放。')}`}
 return `${explainRate('總營收',stat('operations','revenue'),'money')}${explainRate('客訴／設備／人員異常合計',sumMaybe([stat('operations','complaints'),stat('operations','equipment'),stat('operations','staffIssues')]),'number')}${infoNotice('總營收為獨立營業額指標；不可再直接加上 PT 營收與會籍營收，以免重複計算。')}`}

function cloudHeaders(token=session?.access_token){return {'apikey':config.key,'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})}}
function cloudBase(){let url=String(config.url||'').trim().replace(/\/+$/,'');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)&&!/^https:\/\/[a-z0-9.-]+(?::\d+)?$/i.test(url))throw Error('請填寫正確的 HTTPS Supabase 專案網址');if(!config.key||config.key.length<16)throw Error('請填正確的公開 API Key');return url}
async function cloudRequest(path,opts={}){const response=await fetch(cloudBase()+path,{...opts,headers:{...cloudHeaders(),...(opts.headers||{})}});const text=await response.text();let obj=safeParse(text);if(!response.ok)throw Error(obj?.message||obj?.error_description||obj?.msg||text.slice(0,180)||`HTTP ${response.status}`);return obj}

 if(e.target.id==='createAccount'){try{await upsertProfile({user_id:document.getElementById('newAccountId').value.trim(),display_name:document.getElementById('newAccountName').value.trim(),department:document.getElementById('newAccountDept').value,role:document.getElementById('newAccountRole').value,active:true})}catch(err){toast('新增授權失敗：'+err.message)}return}
 if(e.target.dataset.saveAccount){const id=e.target.dataset.saveAccount,row=[...document.querySelectorAll('[data-account-row]')].find(e=>e.dataset.accountRow===id);if(!row)return;const value=k=>row.querySelector(`[data-account-field="${k}"]`).value;try{await upsertProfile({user_id:id,display_name:value('display_name').trim(),department:value('department'),role:value('role'),active:value('active')==='true'})}catch(err){toast('權限更新失敗：'+err.message)}return}
 if(e.target.id==='closeModal'||e.target.id==='modalBackdrop'){if(e.target.id==='modalBackdrop'&&e.target!==document.getElementById('modalBackdrop'))return;closeModal();return}
 if(e.target.id==='saveDetail'){const dept=e.target.dataset.dept,date=e.target.dataset.date;const d={};document.querySelectorAll('[data-detail-field]').forEach(el=>d[el.dataset.detailField]=el.value.trim());if(writeRecord('daily',dept,date,d)){closeModal();toast('每日備註已儲存');render()}return}
 if(e.target.dataset.saveWeek){doSaveWeek(e.target.dataset.saveWeek);return}
 if(e.target.id==='addReportMonth'){if(!canEdit('executive')){toast('需要總經理室編輯權限。');return}let m=document.getElementById('newReportMonth').value;if(!/^\d{4}-\d{2}$/.test(m)){toast('請先選擇月份');return}if(!db.months[m]){db.months[m]={targets:{...db.months[month]?.targets},source:'新增月份'};persist();pending.add('t|executive|'+m);queuePush('t|executive|'+m);toast('已建立月份，目標以目前月份複製，請依營運計畫調整。')}month=m;week=weeksFor(m)[0].start;render();return}
 if(e.target.id==='saveGoals'){if(!canEdit('executive')){toast('僅總經理室系統管理員可修改 KPI 目標。');return}let n=0;document.querySelectorAll('[data-goal]').forEach(el=>{let v=el.value===''?null:Number(el.value);if(v!==null&&!Number.isFinite(v))return;if(el.dataset.goalKind==='percent'&&v!==null)v/=100;writeGoal(el.dataset.goal,v);n++});toast(`已儲存 ${n} 項目標`);render();return}
 if(e.target.id==='exportTopBtn'||e.target.id==='exportExcelBtn'){exportExcel();return}if(e.target.id==='exportJsonBtn'){exportBackup();toast('已匯出全部資料 JSON 備份');return}if(e.target.id==='printMeeting'){printMeeting();return}
 if(e.target.id==='uploadBox'||(e.target.closest('#uploadBox')&&e.target.id!=='fileInput')){if(!canImport()){toast('您沒有匯入權限');return}document.getElementById('fileInput')?.click();return}
 if(e.target.id==='saveCloudConfig'){let u=document.getElementById('cloudUrl').value.trim(),k=document.getElementById('cloudKey').value.trim();if(/service_role|sb_secret_/.test(k)){toast('請勿使用 service_role 或 secret key！');return}config={url:u,key:k};try{cloudBase()}catch(err){toast(err.message);return}localStorage.setItem(CLOUD_CONF_KEY,JSON.stringify(config));toast('已儲存專案網址與公開金鑰');render();return}
 if(e.target.id==='loginBtn'){await loginCloud();return}if(e.target.id==='logoutBtn'){session=null;profile=null;staffProfiles=[];pending.clear();localStorage.removeItem(CLOUD_SESSION_KEY);if(REQUIRE_LOGIN){db={version:1,months:{},records:{}};localStorage.removeItem(DB_KEY)}toast(REQUIRE_LOGIN?'已登出，這台電腦的營運快取已清除。':'已登出雲端，這台電腦的本機展示資料仍會保留。');render();return}
 if(e.target.id==='pullCloudBtn'){await pullCloud();return}if(e.target.id==='pushCloudBtn'){await pushAll();return}
 if(e.target.id==='syncTopBtn'){if(session?.access_token){await pullCloud()}else navigate('cloud');return}
 });
document.addEventListener('change',e=>{const el=e.target;if(el.id==='monthSelect'){month=el.value;week=weeksFor(month)[0]?.start;render();return}if(el.id==='weekSelect'){week=el.value;render();return}
 if(el.id==='fileInput'&&el.files?.length){if(!canImport())return;importFiles([...el.files]);return}
 if(el.matches('[data-daily]')){let d=el.dataset,number=el.value.trim()===''?null:Number(el.value);if(number!==null&&(!Number.isFinite(number)||number<0)){toast('請輸入大於等於0的有效數字');render();return}if(d.kind==='percent'&&number!==null)number/=100;
 if(writeRecord('daily',d.dept,d.date,{[d.metric]:number})){toast(`${d.date} ${deptLabels[d.dept]}資料已儲存`);render()}return}
 if(el.matches('[data-weekly]')){const dept=el.dataset.dept;const p=selectedWeek();writeRecord('weekly',dept,week,extractWeekForm(dept),p.end);return}
 });
const box=document.getElementById('main');box.addEventListener('dragover',e=>{if(e.target.closest('#uploadBox')){e.preventDefault();e.target.closest('#uploadBox').classList.add('dragover')}});box.addEventListener('dragleave',e=>{if(e.target.closest('#uploadBox'))e.target.closest('#uploadBox').classList.remove('dragover')});box.addEventListener('drop',e=>{const area=e.target.closest('#uploadBox');if(area){e.preventDefault();area.classList.remove('dragover');if(!canImport()){toast('您沒有 Excel 匯入權限');return}importFiles([...e.dataTransfer.files])}});
setInterval(async()=>{if(!session?.access_token||document.hidden||busySync)return;const active=document.activeElement;if(active&&['INPUT','TEXTAREA','SELECT'].includes(active.tagName))return;await pullCloud(true)},45000);
render();if(session?.access_token){refreshToken().then(ok=>ok&&loadProfile()).then(()=>{render();if(profile?.active){pullCloud(true);if(canManageUsers())loadProfiles()}})}
</script>
</body>
